model:
    type: DiViDeAddEvaluator
    args:
        backbone:
            fragments:
                use_checkpoint: false
                pretrained:
        backbone_size: swin_tiny
        backbone_preserve_keys: fragments
        divide_head: false
        vqa_head:
            in_channels: 768
            hidden_channels: 64
            
optimizer:
    lr: !!float 1e-3
    backbone_lr_mult: !!float 1e-1
    wd: 0.05
        
#load_path: pretrained_weights/swin_tiny_patch244_window877_kinetics400_1k.pth
load_path: pretrained_weights/SAMA-VQA-sama_default_Epoch_09.pth
